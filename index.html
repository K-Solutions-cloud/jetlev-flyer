<!doctype html>
<html lang="de">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#202020"><title>JETLEV-FLYER • Water Rush</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="style.css"></head>
<body>
<main class="arcade">
 <header class="app-header"><a href="./" class="logo" aria-label="Jetlev-Flyer"><img src="assets/jetlev-flyer-logo.jpg" alt="JETLEV-FLYER"></a><div class="header-right"><button id="sound" class="square" aria-label="Ton ausschalten">♫</button></div></header>
 <section class="cabinet" id="cabinet" aria-label="Jetlev-Flyer Water Rush">
  <canvas id="game" tabindex="0" aria-label="Halte die Spielfläche oder Leertaste zum Steigen, loslassen zum Sinken."></canvas>
  <div class="vignette"></div>
  <div class="hud" id="hud" hidden><div class="hud-score"><strong id="distance">0000<small>m</small></strong></div><div class="hud-coins" id="coin-counter"><span class="pixel-coin">✦</span><strong id="coins">0</strong></div><button id="pause" class="square" aria-label="Pausieren">Ⅱ</button><div class="combo" id="combo"></div><div class="power-status" id="power-status" aria-label="Aktive Power-ups"></div><div class="flow-meter" id="flow-meter"><span id="flow-label">FLOW 0/10</span><div><i id="flow-fill"></i></div></div></div>
  <div class="screen home" id="intro"><div class="title"><span>JETLEV</span><strong>FLYER</strong><div class="title-sticker">WATER RUSH</div></div><div class="home-bottom"><div class="record">♛ BEST <b id="best">0 m</b></div><button class="play-button" id="start"><span>▶</span> PLAY</button><p class="hint">HALTEN ↑ <i>·</i> LOSLASSEN ↓</p></div></div>
  <div class="screen glass" id="result" hidden><div class="result-panel"><div class="zone-tag" id="result-tag">GAME OVER</div><h1><span>SPLASH!</span></h1><div class="score-card"><strong id="final-distance">0<small>m</small></strong><div><span>✦ <b id="final-coins">0</b></span><span>♛ <b id="final-best">0 m</b></span></div></div><button class="play-button" id="restart">↻ &nbsp; REPLAY</button><button class="text-button" id="home">MENÜ</button></div></div>
  <div class="screen glass" id="pause-screen" hidden><div class="result-panel"><h1><span>PAUSE</span></h1><button class="play-button" id="resume">▶ &nbsp; WEITER</button><button class="text-button" id="quit">BEENDEN</button></div></div>
  <div class="event-badge" id="event-badge" hidden></div><div class="toast" id="toast" hidden>READY?</div>
  <div class="boost-hint" id="boost-hint" hidden>HALTEN ↑</div>
 </section>

</main><script src="level.js"></script><script src="effects.js"></script><script src="game.js"></script>
<script src="pwa.js"></script></body></html>
