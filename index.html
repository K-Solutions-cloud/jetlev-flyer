<!doctype html>
<html lang="de">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#202020"><title>Jetlev Paradise Glide</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="style.css"></head>
<body>
<main class="arcade">

 <section class="cabinet" id="cabinet" aria-label="Jetlev Paradise Glide">
  <canvas id="game" tabindex="0" aria-label="Halte die Spielfläche oder Leertaste zum Steigen, loslassen zum Sinken."></canvas>
  <div class="vignette"></div><div class="boot-status" id="boot-status" role="status" hidden></div>
  <div class="hud" id="hud" hidden><div class="hud-score"><strong id="distance">0000<small>m</small></strong></div><div class="hud-coins" id="coin-counter"><img class="pixel-coin" src="assets/icons/coin.svg" alt="Münzen" width="32" height="32"><strong id="coins">0</strong></div><button id="pause" class="square" aria-label="Pausieren">Ⅱ</button><div class="combo" id="combo"></div>
   <div class="effect-dock" aria-label="Bonus-Instrumente"><div class="effect-card boost-card" id="boost-card" hidden><svg class="effect-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-8 12h6l-1 8 9-13h-7Z"/></svg><div class="effect-details"><span class="effect-name">TURBO</span><strong id="boost-time">5<small>s</small></strong></div><div class="effect-track"><i id="boost-fill"></i></div></div>
    <div class="effect-card shield-card" id="shield-card" hidden><svg class="effect-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg><div class="effect-details"><span class="effect-name">SCHILD</span><strong id="shield-time">9<small>s</small></strong></div><div class="effect-track"><i id="shield-fill"></i></div></div>
    <div class="effect-card magnet-card" id="magnet-card" hidden><svg class="effect-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v9a8 8 0 0 0 16 0V4h-5v9a3 3 0 0 1-6 0V4Z"/><path d="M4 8h5m6 0h5"/></svg><div class="effect-details"><span class="effect-name">MAGNET</span><strong id="magnet-time">8<small>s</small></strong></div><div class="effect-track"><i id="magnet-fill"></i></div></div>
    <div class="effect-card flow-meter" id="flow-meter"><img class="effect-icon coin-icon" src="assets/icons/coin.svg" alt="" width="24" height="24"><span id="flow-label"></span><div class="effect-track"><i id="flow-fill"></i></div></div>
    <div class="effect-card gold-card" id="event-badge" hidden><svg class="effect-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/></svg><div class="effect-details"><span class="effect-name">GOLD RUN</span><strong id="gold-time">6<small>s</small></strong></div><div class="effect-track"><i id="gold-fill"></i></div></div>
    <div id="loot-effects" class="loot-effects"></div><div id="eruption-status" class="effect-card eruption-status" role="status" hidden></div>
   </div>
  </div>
  <div class="screen home" id="intro"><div class="home-heading"><div class="home-brand"><img class="home-logo" src="assets/jetlev-flyer-logo.jpg" alt="JETLEV-FLYER"><div class="paradise-lockup"><svg class="paradise-parasol" viewBox="0 0 40 52" aria-hidden="true" shape-rendering="crispEdges"><path fill="#ffe8b5" d="M18 15h3v31h-3zM8 46h24v3H8z"/><path fill="#ed1c24" d="M17 3h6v3h6v4h5v5h4v5H2v-5h4v-5h5V6h6z"/><path fill="#fff3cf" d="M17 6h6v5h4v9H13v-9h4z"/><path fill="#ffb884" d="M2 20h36v3h-5v-3h-9v3h-8v-3H7v3H2z"/><path fill="#ffe36a" d="M31 33h3v3h3v3h-3v3h-3v-3h-3v-3h3z"/></svg><h1 aria-label="Jetlev Paradise Glide"><span class="paradise-word">Paradise</span><span class="glide-word">Glide</span></h1><svg class="paradise-cocktail" viewBox="0 0 40 52" aria-hidden="true" shape-rendering="crispEdges"><path fill="#fff3cf" d="M27 4h9v3h-6l-7 23-3-1zM4 16h29v3h-3v6h-4v5h-5v14h8v3H10v-3h8V30h-5v-5H9v-6H4z"/><path fill="#ff896d" d="M10 20h19v4h-5v5h-7v-5h-4z"/><path fill="#ffe36a" d="M2 8h11v3h3v9h-3v3H4v-3H1v-9h1z"/><path fill="#a7e89b" d="M4 11h8v3h-5v5H4z"/><path fill="#fff3cf" d="M33 32h3v3h3v3h-3v3h-3v-3h-3v-3h3z"/></svg></div></div><button id="sound" class="square" aria-label="Ton ausschalten">♫</button></div><div class="home-profile"><button type="button" class="home-destination" data-open-islands><small>DEIN REVIER</small><strong id="home-island">TÜRKISLAGUNE <i>›</i></strong></button><div class="home-bank"><img src="assets/icons/coin.svg" alt="Münzen" width="25" height="25"><strong id="home-bank">0</strong></div></div><div class="home-bottom"><div class="home-run-info"><div class="record">BEST <b id="best">0 m</b></div><p class="hint">HALTEN ZUM FLIEGEN</p></div><button class="play-button" id="start"><span>▶</span> PLAY</button><button type="button" class="home-mission" data-open-islands><span id="home-mission-label">DEIN NÄCHSTES ZIEL</span><strong id="home-mission-value">0 / 600</strong><progress id="home-mission-progress" value="0" max="600" aria-label="Nächstes Missionsziel"></progress></button></div></div>
  <div class="screen glass" id="result" hidden><div class="result-panel"><div class="zone-tag" id="result-tag">GAME OVER</div><h1><span>SPLASH!</span></h1><div class="score-card"><strong id="final-distance">0<small>m</small></strong><div><span><img class="coin-icon" src="assets/icons/coin.svg" alt="Münzen" width="26" height="26"> <b id="final-coins">0</b></span><span>♛ <b id="final-best">0 m</b></span></div></div><button class="play-button" id="restart">↻ &nbsp; REPLAY</button><button class="text-button" id="home">MENÜ</button></div></div>
  <div class="screen glass" id="pause-screen" hidden><div class="result-panel"><h1><span>PAUSE</span></h1><button class="play-button" id="resume">▶ &nbsp; WEITER</button><button class="text-button" id="pause-sound">TON AN / AUS</button><button class="text-button" id="quit">BEENDEN</button></div></div>
  <div class="toast" id="toast" hidden>READY?</div>
  <div class="boost-hint" id="boost-hint" hidden>HALTEN ↑ · WASSER = GAME OVER</div>
 </section>

</main><script src="flight.js"></script><script src="level.js"></script><script src="heaven.js"></script><script src="bonus.js"></script><script src="loot-effects.js"></script><script src="effects.js"></script><script src="music.js"></script><script src="water.js"></script><script src="director.js"></script><script src="progression.js"></script><script src="theme.js"></script><script src="career.js"></script><script src="game.js"></script>
</body></html>
